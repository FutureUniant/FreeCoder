<svg width="1024" height="1024" viewBox="80 80 800 800" xmlns="http://www.w3.org/2000/svg">
  <!-- 深色圆角正方形底板（铺满导出画布） -->
  <rect x="80" y="80" width="800" height="800" rx="160" fill="#0F344B" />

  <!-- 外围青色圆环 -->
  <circle cx="480" cy="480" r="320" fill="none" stroke="#26E0C8" stroke-width="64" />

  <!-- 左尖角 < -->
  <path
    d="M425 400 L355 480 L425 560"
    fill="none"
    stroke="#26E0C8"
    stroke-width="62"
    stroke-linecap="round"
    stroke-linejoin="round"
  />

  <!-- 右尖角 > -->
  <path
    d="M535 400 L605 480 L535 560"
    fill="none"
    stroke="#26E0C8"
    stroke-width="62"
    stroke-linecap="round"
    stroke-linejoin="round"
  />
</svg>
